<!DOCTYPE html>
<html>
<head>
  <title>My Chat</title>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #222;
      color: white;
      margin: 0;
      padding: 30px;
    }

    h1 {
      text-align: center;
    }

    #messages {
      background: #333;
      border-radius: 10px;
      padding: 15px;
      height: 400px;
      overflow-y: auto;
      margin-bottom: 15px;
    }

    .message {
      background: #444;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
    }

    #messageBox {
      display: flex;
      gap: 10px;
    }

    #messageInput {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>💬 My Chat</h1>

  <div id="messages"></div>

  <div id="messageBox">
    <input
      id="messageInput"
      placeholder="Type a message..."
    >

    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    const socket = io("https://chat-server-2h9q.onrender.com");

    const messages = document.getElementById("messages");
    const input = document.getElementById("messageInput");

    socket.on("connect", () => {
      console.log("Connected to chat server!");
    });

    function sendMessage() {
      const message = input.value.trim();

      if (message === "") return;

      socket.emit("chat message", message);

      input.value = "";
    }

    socket.on("chat message", (message) => {
      const messageElement = document.createElement("div");

      messageElement.className = "message";
      messageElement.textContent = message;

      messages.appendChild(messageElement);

      messages.scrollTop = messages.scrollHeight;
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
