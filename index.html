<body>

  <!-- =========================
       AUTH SCREEN
  ========================= -->

  <div id="authScreen">

    <div class="authBox">

      <h1 id="authTitle">
        Welcome Back!
      </h1>

      <div
        class="subtitle"
        id="authSubtitle"
      >
        Log in to continue to My Chat
      </div>

      <!-- Username only appears during Sign Up -->

      <input
        id="usernameInput"
        class="hidden"
        type="text"
        placeholder="Username"
        autocomplete="username"
      >

      <input
        id="emailInput"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="passwordInput"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button
        class="authButton"
        id="authButton"
        type="button"
      >
        Log In
      </button>

      <!-- THIS IS NOW A REAL BUTTON -->

      <button
        class="switchButton"
        id="switchButton"
        type="button"
      >
        Don't have an account? Sign Up
      </button>

      <div id="status"></div>

    </div>

  </div>


  <!-- =========================
       CHAT SCREEN
  ========================= -->

  <div id="chatScreen">

    <div id="topBar">

      <div id="topBarLeft">

        💬 <strong>My Chat</strong>

        <span id="currentUser"></span>

      </div>

      <button
        id="logoutButton"
        type="button"
      >
        Log Out
      </button>

    </div>


    <div id="messages"></div>


    <div id="messageArea">

      <input
        id="messageInput"
        type="text"
        placeholder="Message..."
      >

      <button
        id="sendButton"
        type="button"
      >
        Send
      </button>

    </div>

  </div>


<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://tscporvkmgkwymrftzyn.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_f-OuNvj9jXyjcL0sZ3awvg__HZ3S_Ry";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     SOCKET.IO
  ========================= */

  const socket =
    io("https://chat-server-2h9q.onrender.com");


  /* =========================
     ELEMENTS
  ========================= */

  const authScreen =
    document.getElementById("authScreen");

  const chatScreen =
    document.getElementById("chatScreen");

  const authTitle =
    document.getElementById("authTitle");

  const authSubtitle =
    document.getElementById("authSubtitle");

  const authButton =
    document.getElementById("authButton");

  const switchButton =
    document.getElementById("switchButton");

  const usernameInput =
    document.getElementById("usernameInput");

  const emailInput =
    document.getElementById("emailInput");

  const passwordInput =
    document.getElementById("passwordInput");

  const status =
    document.getElementById("status");

  const currentUser =
    document.getElementById("currentUser");

  const logoutButton =
    document.getElementById("logoutButton");

  const messages =
    document.getElementById("messages");

  const messageInput =
    document.getElementById("messageInput");

  const sendButton =
    document.getElementById("sendButton");


  let signupMode = false;
  let loggedInUser = null;


  /* =========================
     SWITCH LOGIN / SIGN UP
  ========================= */

  switchButton.addEventListener("click", function () {

    signupMode = !signupMode;

    status.textContent = "";

    if (signupMode) {

      // SIGN UP SCREEN

      authTitle.textContent =
        "Create Your Account";

      authSubtitle.textContent =
        "Make your account for My Chat";

      authButton.textContent =
        "Sign Up";

      usernameInput.classList.remove("hidden");

      usernameInput.focus();

      switchButton.textContent =
        "Already have an account? Log In";

      passwordInput.setAttribute(
        "autocomplete",
        "new-password"
      );

    } else {

      // LOGIN SCREEN

      authTitle.textContent =
        "Welcome Back!";

      authSubtitle.textContent =
        "Log in to continue to My Chat";

      authButton.textContent =
        "Log In";

      usernameInput.classList.add("hidden");

      switchButton.textContent =
        "Don't have an account? Sign Up";

      emailInput.focus();

      passwordInput.setAttribute(
        "autocomplete",
        "current-password"
      );

    }

  });


  /* =========================
     SIGN UP / LOGIN
  ========================= */

  authButton.addEventListener("click", async function () {

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;

    const username =
      usernameInput.value.trim();


    /* VALIDATION */

    if (!email) {

      status.textContent =
        "Please enter your email.";

      return;
    }


    if (!password) {

      status.textContent =
        "Please enter your password.";

      return;
    }


    /* =========================
       SIGN UP
    ========================= */

    if (signupMode) {

      if (!username) {

        status.textContent =
          "Please choose a username.";

        usernameInput.focus();

        return;
      }


      if (username.length < 3) {

        status.textContent =
          "Username must be at least 3 characters.";

        return;
      }


      status.textContent =
        "Creating your account...";


      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password

        });


      if (error) {

        status.textContent =
          error.message;

        return;
      }


      /* CREATE PROFILE */

      if (data.user) {

        const { error: profileError } =
          await supabaseClient
            .from("profiles")
            .insert({

              id: data.user.id,

              username: username,

              display_name: username

            });


        if (profileError) {

          status.textContent =
            "Account created, but your profile could not be created: " +
            profileError.message;

          return;
        }

      }


      status.textContent =
        "Account created! Check your email if confirmation is required.";

      return;

    }


    /* =========================
       LOGIN
    ========================= */

    status.textContent =
      "Logging in...";


    const { error } =
      await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });


    if (error) {

      status.textContent =
        error.message;

      return;
    }


    await showChat();

  });


  /* =========================
     SHOW CHAT
  ========================= */

  async function showChat() {

    const { data } =
      await supabaseClient.auth.getUser();

    loggedInUser =
      data.user;


    if (!loggedInUser) {
      return;
    }


    const { data: profile } =
      await supabaseClient
        .from("profiles")
        .select(
          "username, display_name"
        )
        .eq(
          "id",
          loggedInUser.id
        )
        .maybeSingle();


    authScreen.style.display =
      "none";

    chatScreen.style.display =
      "flex";


    if (profile) {

      currentUser.textContent =
        "@" + profile.username;

    } else {

      currentUser.textContent =
        "@" + loggedInUser.email;

    }

  }


  /* =========================
     LOG OUT
  ========================= */

  logoutButton.addEventListener(
    "click",
    async function () {

      await supabaseClient.auth.signOut();

      loggedInUser = null;

      chatScreen.style.display =
        "none";

      authScreen.style.display =
        "flex";

      emailInput.value = "";

      passwordInput.value = "";

      usernameInput.value = "";

      status.textContent = "";

    }
  );


  /* =========================
     SEND MESSAGE
  ========================= */

  function sendMessage() {

    const text =
      messageInput.value.trim();


    if (!text) {
      return;
    }


    socket.emit(
      "chat message",
      {

        text: text,

        username:
          loggedInUser?.email ||
          "User"

      }
    );


    messageInput.value = "";

    messageInput.focus();

  }


  sendButton.addEventListener(
    "click",
    sendMessage
  );


  messageInput.addEventListener(
    "keydown",
    function (event) {

      if (event.key === "Enter") {

        sendMessage();

      }

    }
  );


  /* =========================
     RECEIVE MESSAGES
  ========================= */

  socket.on(
    "chat message",
    function (message) {

      const messageDiv =
        document.createElement("div");

      messageDiv.className =
        "message";


      const userDiv =
        document.createElement("div");

      userDiv.className =
        "messageUser";

      userDiv.textContent =
        message.username;


      const textDiv =
        document.createElement("div");

      textDiv.className =
        "messageText";

      textDiv.textContent =
        message.text;


      messageDiv.appendChild(
        userDiv
      );

      messageDiv.appendChild(
        textDiv
      );


      messages.appendChild(
        messageDiv
      );


      messages.scrollTop =
        messages.scrollHeight;

    }
  );


  /* =========================
     CHECK EXISTING SESSION
  ========================= */

  supabaseClient.auth
    .getSession()
    .then(function ({ data }) {

      if (data.session) {

        showChat();

      }

    });

</script>

</body>
</html>
