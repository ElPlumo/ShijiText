  /* =====================================================

  let signupMode = false;

  /* =====================================================
     LOGIN / SIGN UP SWITCH
  ====================================================== */

  switchButton.addEventListener(
    "click",
    function () {

      signupMode = !signupMode;

      status.textContent = "";


      if (signupMode) {

        authTitle.textContent =
          "Create Your Account";

        authSubtitle.textContent =
          "Make your account for My Chat";

        authButton.textContent =
          "Sign Up";

        usernameInput.classList.remove(

        );

        usernameInput.focus();

        switchButton.textContent =
          "Already have an account? Log In";


      } else {

        authTitle.textContent =
          "Welcome Back!";

        authSubtitle.textContent =
          "Log in to continue to My Chat";

        authButton.textContent =
          "Log In";

        usernameInput.classList.add(
          "hidden"
        );

        emailInput.focus();

        switchButton.textContent =
          "Don't have an account? Sign Up";

      }

    }
  );



  /* =====================================================
     SIGN UP / LOGIN
  ====================================================== */

  authButton.addEventListener(
    "click",
    async function () {

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;

      const username =
        usernameInput.value.trim();


      if (!email) {

        status.textContent =
          "Please enter your email.";

        return;
      }


      if (!password) {

        status.textContent =
          "Please enter your password.";

        return;
      }


      /* =========================
         SIGN UP
      ========================== */

      if (signupMode) {

        if (!username) {

          status.textContent =
            "Please choose a username.";

          return;
        }


        if (username.length < 3) {

          status.textContent =
            "Username must be at least 3 characters.";

          return;
        }


        status.textContent =
          "Creating your account...";


        const { data, error } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password

          });


        if (error) {

          status.textContent =
            error.message;

          return;
        }


        if (data.user) {

          const { error: profileError } =
            await supabaseClient
              .from("profiles")
              .insert({

                id: data.user.id,

                username: username,

                display_name: username

              });


          if (profileError) {

            status.textContent =
              "Account created, but profile setup failed: " +
              profileError.message;

            return;
          }

        }


        status.textContent =
          "Account created! You can now log in.";

        return;

      }



      /* =========================
         LOGIN
      ========================== */

      status.textContent =
        "Logging in...";


      const { error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });


      if (error) {

        status.textContent =
          error.message;

        return;
      }


      await showChat();

    }
  );



  /* =====================================================
     SHOW CHAT
  ====================================================== */

  async function showChat() {

    const { data } =
      await supabaseClient.auth.getUser();

    loggedInUser =
      data.user;


    if (!loggedInUser) {
      return;
    }


    await updateUserDisplay();


    authScreen.style.display =
      "none";

    chatScreen.style.display =
      "flex";

  }



  /* =====================================================
     UPDATE USER DISPLAY
  ====================================================== */

  async function updateUserDisplay() {

    if (!loggedInUser) {
      return;
    }


    const { data: profile } =
      await supabaseClient
        .from("profiles")
        .select(
          "username, display_name"
        )
        .eq(
          "id",
          loggedInUser.id
        )
        .maybeSingle();


    if (profile) {

      currentUser.textContent =
        "@" + profile.username;

    } else {

      currentUser.textContent =
        "@" + loggedInUser.email;

    }

  }



  /* =====================================================
     LOG OUT
  ====================================================== */

  logoutButton.addEventListener(
    "click",
    async function () {

      await supabaseClient.auth.signOut();

      loggedInUser = null;

      chatScreen.style.display =
        "none";

      authScreen.style.display =
        "flex";

      emailInput.value = "";

      passwordInput.value = "";

      usernameInput.value = "";

      status.textContent = "";

    }
  );



  /* =====================================================
     OPEN PROFILE
  ====================================================== */

  profileButton.addEventListener(
    "click",
    async function () {

      await loadProfile();

      profileOverlay.style.display =
        "flex";

    }
  );



  /* =====================================================
     CLOSE PROFILE
  ====================================================== */

  closeProfile.addEventListener(
    "click",
    function () {

      profileOverlay.style.display =
        "none";

    }
  );


  profileOverlay.addEventListener(
    "click",
    function (event) {

      if (event.target === profileOverlay) {

        profileOverlay.style.display =
          "none";

      }

    }
  );



  /* =====================================================
     LOAD PROFILE
  ====================================================== */

  async function loadProfile() {

    if (!loggedInUser) {
      return;
    }


    profileStatus.textContent =
      "Loading...";


    const { data, error } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq(
          "id",
          loggedInUser.id
        )
        .maybeSingle();


    if (error) {

      profileStatus.textContent =
        error.message;

      return;
    }


    if (!data) {

      profileStatus.textContent =
        "No profile found.";

      return;
    }


    displayNameInput.value =
      data.display_name || "";

    profileUsernameInput.value =
      data.username || "";

    avatarInput.value =
      data.avatar_url || "";

    bannerInput.value =
      data.banner_url || "";

    bioInput.value =
      data.bio || "";

    customStatusInput.value =
      data.custom_status || "";

    emojiInput.value =

    colorInput.value =
      data.accent_color || "#5865F2";

    websiteInput.value =
      data.website_url || "";

    decorationInput.value =
      data.profile_decoration || "";

    effectInput.value =
      data.profile_effect || "";


    profileStatus.textContent = "";


    updatePreview();

      if (!loggedInUser) {

      }


      const username =
        profileUsernameInput.value.trim();

      const displayName =
        displayNameInput.value.trim();


      if (!username) {

        profileStatus.textContent =
          "Username cannot be empty.";

        return;
      }


      if (!displayName) {

        profileStatus.textContent =
          "Display name cannot be empty.";

        return;
      }


      profileStatus.textContent =
        "Saving...";


      const { error } =
        await supabaseClient
          .from("profiles")
          .update({

            username:
              username,

            display_name:
              displayName,

            bio:
              bioInput.value,

            avatar_url:
              avatarInput.value,

            banner_url:
              bannerInput.value,

            accent_color:
              colorInput.value,

            custom_status:
              customStatusInput.value,

            favorite_emoji:
              emojiInput.value,

            website_url:
              websiteInput.value,

            profile_decoration:
              decorationInput.value,

            profile_effect:
              effectInput.value,

            updated_at:
              new Date().toISOString()

          })
          .eq(
            "id",
            loggedInUser.id
          );


      if (error) {

        profileStatus.textContent =
          error.message;

        return;
      }


      profileStatus.textContent =
        "Profile saved! ✓";


      await updateUserDisplay();

      updatePreview();

    }
  );



  /* =====================================================
     LIVE PROFILE PREVIEW
  ====================================================== */

  const profileInputs = [

    displayNameInput,

    profileUsernameInput,

    avatarInput,

    bannerInput,

    bioInput,

    customStatusInput,

    emojiInput,

    colorInput,

    websiteInput,

    decorationInput,

    effectInput

  ];


  profileInputs.forEach(
    function (input) {

      input.addEventListener(
        "input",
        updatePreview
      );

      input.addEventListener(
        "change",
        updatePreview
      );

    }
  );



  /* =====================================================
     UPDATE PROFILE PREVIEW
  ====================================================== */

  function updatePreview() {

    const name =
      displayNameInput.value.trim() ||
      "Your Name";

    const username =
      profileUsernameInput.value.trim() ||
      "username";

    const avatar =
      avatarInput.value.trim();

    const banner =
      bannerInput.value.trim();

    const bio =
      bioInput.value.trim() ||
      "Your bio will appear here.";

    const customStatus =
      customStatusInput.value.trim() ||
      "No status";

    const emoji =
      emojiInput.value.trim() ||
      "😀";

    const color =
      colorInput.value ||
      "#5865F2";

    const website =
      websiteInput.value.trim();

    const decoration =
      decorationInput.value;

    const effect =
      effectInput.value;


    /* NAME */

    previewName.textContent =
      name;


    /* USERNAME */

    previewUsername.textContent =
      "@" + username;


    /* BIO */

    previewBio.textContent =
      bio;


    /* STATUS */

    previewStatus.textContent =
      "● " + customStatus;


    /* EMOJI */

    previewEmoji.textContent =
      emoji;


    /* COLOR */

    previewBanner.style.backgroundColor =
      color;

    previewAvatar.style.backgroundColor =
      color;


    /* AVATAR */

    if (avatar) {

      previewAvatar.src =
        avatar;

    } else {

      previewAvatar.removeAttribute(
        "src"
      );

      previewAvatar.style.backgroundColor =
        color;

    }


    /* BANNER */

    if (banner) {

      previewBanner.style.backgroundImage =
        "url('" +
        banner.replace(/'/g, "%27") +
        "')";

    } else {

      previewBanner.style.backgroundImage =
        "none";

    }


    /* WEBSITE */

    previewLinks.innerHTML = "";

    if (website) {

      const link =
        document.createElement("a");

      link.href =
        website;

      link.target =
        "_blank";

      link.rel =
        "noopener noreferrer";

      link.textContent =
        "🔗 " + website;

      previewLinks.appendChild(
        link
      );

    }


    /* DECORATION */

    previewDecoration.textContent =
      decoration;


    /* EFFECT */

    if (effect === "Glow") {

      profileCard.style.boxShadow =
        "0 0 25px " + color;

    } else if (effect === "Shadow") {

      profileCard.style.boxShadow =
        "0 15px 35px rgba(0,0,0,.8)";

    } else if (effect === "Glass") {

      profileCard.style.boxShadow =
        "0 0 30px rgba(255,255,255,.15)";

    } else {

      profileCard.style.boxShadow =
        "none";

    }

  }



  /* =====================================================
     SEND MESSAGE
  ====================================================== */

  function sendMessage() {

    const text =
      messageInput.value.trim();


    if (!text) {
      return;
    }


    socket.emit(
      "chat message",
      {

        text: text,

        username:
          loggedInUser?.email ||
          "User"

      }
    );


    messageInput.value = "";

    messageInput.focus();

  }


  sendButton.addEventListener(
    "click",
    sendMessage
  );


  messageInput.addEventListener(
    "keydown",
    function (event) {

      if (event.key === "Enter") {

        sendMessage();

      }

    }
  );



  /* =====================================================
     RECEIVE MESSAGES
  ====================================================== */

  socket.on(
    "chat message",
    function (message) {

      const messageDiv =
        document.createElement("div");

      messageDiv.className =
        "message";


      const userDiv =
        document.createElement("div");

      userDiv.className =
        "messageUser";

      userDiv.textContent =
        message.username;


      const textDiv =
        document.createElement("div");

      textDiv.className =
        "messageText";

      textDiv.textContent =
        message.text;


      messageDiv.appendChild(
        userDiv
      );

      messageDiv.appendChild(
        textDiv
      );


      messages.appendChild(
        messageDiv
      );


      messages.scrollTop =
        messages.scrollHeight;

    }
  );



  /* =====================================================
     CHECK EXISTING SESSION
  ====================================================== */

  supabaseClient.auth
    .getSession()
    .then(
      function ({ data }) {

        if (data.session) {

          showChat();

        }

      }
    );

</script>

</body>
</html>
