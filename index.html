  <script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      "https://tscporvkmgkwymrftzyn.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_f-OuNvj9jXyjcL0sZ3awvg__HZ3S_Ry";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================
       SOCKET.IO
    ========================= */

    const socket =
      io("https://chat-server-2h9q.onrender.com");


    /* =========================
       VARIABLES
    ========================= */

    let loggedInUser = null;
    let currentProfile = null;
    let authMode = "login";


    /* =========================
       ELEMENTS
    ========================= */

    const authScreen =
      document.getElementById("authScreen");

    const chatScreen =
      document.getElementById("chatScreen");

    const authTitle =
      document.getElementById("authTitle");

    const authSubtitle =
      document.getElementById("authSubtitle");

    const usernameContainer =
      document.getElementById("usernameContainer");

    const usernameInput =
      document.getElementById("usernameInput");

    const emailInput =
      document.getElementById("emailInput");

    const passwordInput =
      document.getElementById("passwordInput");

    const authButton =
      document.getElementById("authButton");

    const switchButton =
      document.getElementById("switchButton");

    const switchText =
      document.getElementById("switchText");

    const authMessage =
      document.getElementById("authMessage");

    const messages =
      document.getElementById("messages");

    const messageInput =
      document.getElementById("messageInput");

    const chatForm =
      document.getElementById("chatForm");

    const currentUsername =
      document.getElementById("currentUsername");

    const currentAvatar =
      document.getElementById("currentAvatar");


    /* =========================
       AUTH MODE
    ========================= */

    switchButton.addEventListener("click", () => {

      if (authMode === "login") {

        authMode = "signup";

        authTitle.textContent = "Create Account";
        authSubtitle.textContent = "Make your new account";
        usernameContainer.style.display = "block";
        authButton.textContent = "Sign Up";
        switchText.textContent = "Already have an account?";
        switchButton.textContent = "Log In";

      } else {

        authMode = "login";

        authTitle.textContent = "Welcome Back";
        authSubtitle.textContent = "Log in to your account";
        usernameContainer.style.display = "none";
        authButton.textContent = "Log In";
        switchText.textContent = "Don't have an account?";
        switchButton.textContent = "Sign Up";

      }

      authMessage.textContent = "";

    });


    /* =========================
       AUTH BUTTON
    ========================= */

    authButton.addEventListener("click", async () => {

      authMessage.textContent = "";

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;

      if (!email || !password) {
        authMessage.textContent =
          "Please enter your email and password.";
        return;
      }


      /* SIGN UP */

      if (authMode === "signup") {

        const username =
          usernameInput.value.trim();

        if (!username) {
          authMessage.textContent =
            "Please choose a username.";
          return;
        }

        if (username.length < 3) {
          authMessage.textContent =
            "Username must be at least 3 characters.";
          return;
        }


        const { data, error } =
          await supabaseClient.auth.signUp({
            email,
            password
          });


        if (error) {
          authMessage.textContent =
            error.message;
          return;
        }


        if (!data.user) {
          authMessage.textContent =
            "Account could not be created.";
          return;
        }


        const { error: profileError } =
          await supabaseClient
            .from("profiles")
            .insert({
              id: data.user.id,
              username: username,
              display_name: username
            });


        if (profileError) {
          authMessage.textContent =
            profileError.message;
          return;
        }


        loggedInUser = data.user;

        await loadProfile();

        showChat();

      }


      /* LOGIN */

      else {

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email,
            password
          });


        if (error) {
          authMessage.textContent =
            error.message;
          return;
        }


        loggedInUser = data.user;

        await loadProfile();

        showChat();

      }

    });


    /* =========================
       CHECK EXISTING SESSION
    ========================= */

    async function checkSession() {

      const { data } =
        await supabaseClient.auth.getSession();

      if (data.session) {

        loggedInUser =
          data.session.user;

        await loadProfile();

        showChat();

      }

    }

    checkSession();


    /* =========================
       LOAD PROFILE
    ========================= */

    async function loadProfile() {

      if (!loggedInUser) return;


      let { data, error } =
        await supabaseClient
          .from("profiles")
          .select("*")
          .eq("id", loggedInUser.id)
          .maybeSingle();


      if (error) {
        console.error(
          "Profile loading error:",
          error
        );
      }


      /* If the profile somehow doesn't exist,
         create one automatically. */

      if (!data) {

        const fallbackUsername =
          loggedInUser.email
            ? loggedInUser.email.split("@")[0]
            : "User";


        const { data: newProfile } =
          await supabaseClient
            .from("profiles")
            .insert({
              id: loggedInUser.id,
              username: fallbackUsername,
              display_name: fallbackUsername
            })
            .select()
            .single();


        data = newProfile;

      }


      currentProfile = data;

      updateCurrentUserUI();

    }


    /* =========================
       UPDATE USER UI
    ========================= */

    function updateCurrentUserUI() {

      if (!currentProfile) return;


      const displayName =
        currentProfile.display_name ||
        currentProfile.username ||
        "User";


      const username =
        currentProfile.username ||
        "user";


      currentUsername.textContent =
        displayName;


      if (currentProfile.avatar_url) {

        currentAvatar.outerHTML = `
          <img
            id="currentAvatar"
            class="smallAvatar"
            src="${escapeHtml(currentProfile.avatar_url)}"
            alt=""
          >
        `;

      } else {

        currentAvatar.textContent =
          (displayName[0] || "U").toUpperCase();

      }

    }


    /* =========================
       SHOW CHAT
    ========================= */

    function showChat() {

      authScreen.style.display =
        "none";

      chatScreen.style.display =
        "block";

      updateCurrentUserUI();

      messageInput.focus();

    }


    /* =========================
       LOGOUT
    ========================= */

    document
      .getElementById("logoutButton")
      .addEventListener("click", async () => {

        await supabaseClient.auth.signOut();

        loggedInUser = null;
        currentProfile = null;

        chatScreen.style.display =
          "none";

        authScreen.style.display =
          "flex";

        emailInput.value = "";
        passwordInput.value = "";
        usernameInput.value = "";

      });


    /* =========================
       SEND MESSAGE
    ========================= */

    chatForm.addEventListener("submit", (event) => {

      event.preventDefault();

      const text =
        messageInput.value.trim();

      if (!text || !loggedInUser || !currentProfile) {
        return;
      }


      /*
        IMPORTANT:

        Before, this was sending the user's email.

        Now it sends the profile username,
        display name, and profile picture.
      */

      socket.emit("chat message", {

        text: text,

        userId: loggedInUser.id,

        username:
          currentProfile.username ||
          "user",

        displayName:
          currentProfile.display_name ||
          currentProfile.username ||
          "User",

        avatar:
          currentProfile.avatar_url ||
          "",

        timestamp:
          new Date().toISOString()

      });


      messageInput.value = "";

    });


    /* =========================
       RECEIVE MESSAGE
    ========================= */

    socket.on("chat message", (message) => {

      addMessage(message);

    });


    /* =========================
       DISPLAY MESSAGE
    ========================= */

    function addMessage(message) {

      const messageElement =
        document.createElement("div");

      messageElement.className =
        "message";


      /* Avatar */

      let avatarHTML = "";

      if (message.avatar) {

        avatarHTML = `
          <img
            class="messageAvatar"
            src="${escapeHtml(message.avatar)}"
            alt=""
          >
        `;

      } else {

        const firstLetter =
          (
            message.displayName ||
            message.username ||
            "U"
          )[0].toUpperCase();


        avatarHTML = `
          <div class="messageAvatar"
               style="
                 display:flex;
                 align-items:center;
                 justify-content:center;
                 font-weight:bold;
                 background:#5865F2;
               ">
            ${escapeHtml(firstLetter)}
          </div>
        `;

      }


      /* Username */

      const name =
        message.displayName ||
        message.username ||
        "User";


      /* Time */

      let time = "";

      if (message.timestamp) {

        const date =
          new Date(message.timestamp);

        time =
          date.toLocaleTimeString([], {
            hour: "numeric",
            minute: "2-digit"
          });

      }


      messageElement.innerHTML = `

        ${avatarHTML}

        <div class="messageContent">

          <div class="messageTop">

            <span
              class="messageUsername"
              title="@${escapeHtml(
                message.username || "user"
              )}"
            >
              ${escapeHtml(name)}

        if (!loggedInUser) return;

        const displayName =
          displayNameInput.value.trim();


        if (!username) {

          alert(
            "Please enter a username."
          );

          return;

        }


        if (!displayName) {

          alert(

          );

        }


        const updateData = {

          display_name:
            displayName,

          bio:
            bioInput.value.trim(),

          avatar_url:
            avatarInput.value.trim(),

          banner_url:
            bannerInput.value.trim(),

          accent_color:
            accentColor.value,

          custom_status:
            customStatusInput.value.trim(),

          favorite_emoji:

            "😀",

          website_url:

          social_url:

          profile_decoration:
            decorationInput.value,

          profile_effect:
            effectInput.value,

          updated_at:
            new Date().toISOString()

        };


        const {
          data,
          error
        } = await supabaseClient
          .from("profiles")
          .update(updateData)
          .eq(
            "id",
            loggedInUser.id
          )
          .select()
          .single();


        if (error) {

          alert(
            "Could not save profile:\n" +
            error.message
          );

        updateCurrentUserUI();


        profileModal.style.display =
          "none";


        alert(
          "Profile saved! 🎉"
        );

      });


    /* =========================
       ESCAPE HTML
       Prevents messages from
       inserting HTML into chat.
    ========================= */

    function escapeHtml(value) {

      const div =
        document.createElement("div");

      div.textContent =
        String(value ?? "");

      return div.innerHTML;

    }
