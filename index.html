```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Chat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111214;
      color: white;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    /* =========================
       AUTH
    ========================= */

    #authScreen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;

      background:
        linear-gradient(
          135deg,
          #5865f2,
          #8b5cf6,
          #ec4899
        );
    }

    .authBox {
      width: 100%;
      max-width: 430px;
      background: #1e1f22;
      padding: 35px;
      border-radius: 18px;

      box-shadow:
        0 20px 60px rgba(0,0,0,.4);
    }

    .authBox h1 {
      text-align: center;
      margin-top: 0;
      font-size: 32px;
    }

    .authBox p {
      text-align: center;
      color: #b5bac1;
    }

    .authBox input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;

      border: none;
      border-radius: 8px;

      background: #111214;
      color: white;
      outline: none;
    }

    .authButton {
      width: 100%;
      padding: 14px;
      margin-top: 12px;

      border: none;
      border-radius: 8px;

      background: #5865f2;
      color: white;

      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }

    .authButton:hover {
      background: #4752c4;
    }

    .switchButton {
      background: none;
      border: none;
      color: #00a8fc;
      cursor: pointer;
      font-size: 14px;
    }

    #authMessage {
      margin-top: 12px;
      min-height: 20px;
      color: #ff7b7b;
    }

    /* =========================
       CHAT APP
    ========================= */

    #chatScreen {
      display: none;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      width: 250px;
      background: #1e1f22;

      border-right:
        1px solid #111214;

      display: flex;
      flex-direction: column;
    }

    .serverTitle {
      padding: 18px;
      font-size: 20px;
      font-weight: bold;

      border-bottom:
        1px solid #111214;
    }

    .rooms {
      padding: 12px;
      flex: 1;
    }

    .room {
      padding: 12px;
      margin-bottom: 5px;

      border-radius: 7px;

      cursor: pointer;
      color: #b5bac1;
      transition: .15s;
    }

    .room:hover {
      background: #35373c;
      color: white;
    }

    .room.active {
      background: #404249;
      color: white;
    }

    /* =========================
       USER PANEL
    ========================= */

    .userPanel {
      padding: 12px;
      background: #111214;

      display: flex;
      align-items: center;
      gap: 8px;
    }

    .smallAvatar {
      width: 38px;
      height: 38px;

      border-radius: 50%;
      object-fit: cover;

      background: #5865f2;

      display: flex;
      justify-content: center;
      align-items: center;

      font-weight: bold;
      flex-shrink: 0;
    }

    .userInfo {
      flex: 1;
      overflow: hidden;
    }

    .userName {
      font-weight: bold;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .userStatus {
      color: #23a55a;
      font-size: 12px;
    }

    .profileButton,
    .logoutButton {
      border: none;
      border-radius: 6px;
      padding: 7px;
      cursor: pointer;
      color: white;
    }

    .profileButton {
      background: #5865f2;
    }

    .logoutButton {
      background: #ed4245;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chatHeader {
      height: 60px;
      background: #1e1f22;

      display: flex;
      align-items: center;

      padding: 0 20px;

      font-size: 18px;
      font-weight: bold;

      border-bottom:
        1px solid #111214;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #313338;
    }

    /* =========================
       MESSAGES
    ========================= */

    .message {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
    }

    .messageAvatar {
      width: 42px;
      height: 42px;

      border-radius: 50%;
      object-fit: cover;

      background: #5865f2;
      flex-shrink: 0;

      cursor: pointer;
    }

    .messageAvatar:hover {
      opacity: .85;
    }

    .messageContent {
      min-width: 0;
    }

    .messageTop {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .messageUsername {
      font-weight: bold;
      cursor: pointer;
    }

    .messageUsername:hover {
      text-decoration: underline;
    }

    .timestamp {
      color: #949ba4;
      font-size: 11px;
    }

    .messageText {
      margin-top: 4px;
      color: #dbdee1;

      word-wrap: break-word;
      white-space: pre-wrap;
    }

    /* =========================
       INPUT
    ========================= */

    .chatInputArea {
      padding: 15px;
      background: #313338;
    }

    .chatForm {
      display: flex;
      gap: 10px;
    }

    #messageInput {
      flex: 1;

      background: #383a40;
      border: none;
      border-radius: 8px;

      padding: 14px;
      color: white;
      outline: none;
      font-size: 15px;
    }

    #sendButton {
      border: none;
      background: #5865f2;
      color: white;

      padding: 0 20px;
      border-radius: 8px;

      cursor: pointer;
      font-weight: bold;
    }

    #sendButton:hover {
      background: #4752c4;
    }

    /* =========================
       ANNOUNCEMENT POPUP
    ========================= */

    #announcementPopup {
      position: fixed;

      top: 20px;
      left: 50%;

      transform:
        translateX(-50%)
        translateY(-150px);

      width: min(
        600px,
        calc(100vw - 40px)
      );

      background: #1e1f22;

      border: 2px solid #5865f2;

      border-radius: 14px;

      padding: 16px 45px 16px 18px;

      display: flex;
      align-items: center;
      gap: 14px;

      box-shadow:
        0 10px 35px
        rgba(0, 0, 0, 0.5);

      z-index: 9999;

      opacity: 0;
      pointer-events: none;

      transition:
        transform 0.3s ease,
        opacity 0.3s ease;
    }

    #announcementPopup.show {
      transform:
        translateX(-50%)
        translateY(0);

      opacity: 1;
      pointer-events: auto;
    }

    .announcementIcon {
      font-size: 28px;
      flex-shrink: 0;
    }

    .announcementContent {
      min-width: 0;
    }

    .announcementTitle {
      font-size: 14px;
      font-weight: bold;

      color: #5865f2;

      margin-bottom: 4px;
    }

    #announcementText {
      color: white;
      font-size: 15px;

      word-wrap: break-word;
    }

    #closeAnnouncement {
      position: absolute;

      top: 8px;
      right: 10px;

      border: none;
      background: transparent;

      color: #b5bac1;

      font-size: 24px;

      cursor: pointer;
    }

    #closeAnnouncement:hover {
      color: white;
    }

    /* =========================
       MENTION NOTIFICATIONS
    ========================= */

    #mentionContainer {
      position: fixed;

      top: 20px;
      right: 20px;

      width: 330px;
      max-width:
        calc(100vw - 40px);

      z-index: 10000;

      display: flex;
      flex-direction: column;

      gap: 10px;
    }

    .mentionNotification {
      background: #1e1f22;

      border-left:
        4px solid #5865f2;

      border-radius: 10px;

      padding: 14px;

      box-shadow:
        0 10px 30px
        rgba(0, 0, 0, 0.5);

      cursor: pointer;

      animation:
        mentionSlideIn
        0.2s ease;
    }

    .mentionNotification:hover {
      background: #2b2d31;
    }

    .mentionTitle {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .mentionText {
      color: #b5bac1;

      font-size: 13px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mentionChannel {
      color: #949ba4;

      font-size: 12px;

      margin-top: 5px;
    }

    @keyframes mentionSlideIn {

      from {
        opacity: 0;
        transform:
          translateX(30px);
      }

      to {
        opacity: 1;
        transform:
          translateX(0);
      }

    }

    /* =========================
       PROFILE EDITOR
    ========================= */

    #profileModal {
      display: none;

      position: fixed;
      inset: 0;

      background:
        rgba(0,0,0,.75);

      z-index: 100;

      justify-content: center;
      align-items: center;

      padding: 20px;
      overflow-y: auto;
    }

    .profileEditor {
      width: 100%;
      max-width: 850px;

      background: #1e1f22;
      border-radius: 15px;

      padding: 25px;

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 25px;
    }

    .profileEditor h2 {
      grid-column: 1 / -1;
      margin: 0;
    }

    .editorFields label {
      display: block;

      color: #b5bac1;
      font-size: 13px;

      margin-top: 12px;
      margin-bottom: 5px;
    }

    .editorFields input,
    .editorFields textarea,
    .editorFields select {
      width: 100%;

      padding: 11px;
      border-radius: 7px;
      border: none;

      background: #111214;
      color: white;
      outline: none;
    }

    .editorFields textarea {
      min-height: 80px;
      resize: vertical;
    }

    .colorRow {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #accentColor {
      width: 55px;
      height: 40px;
      padding: 2px;
    }

    .preview {
      border-radius: 12px;
      overflow: hidden;

      background: #313338;
      height: fit-content;
    }

    .previewBanner {
      height: 130px;

      background: #5865f2;

      background-size: cover;
      background-position: center;
    }

    .previewBody {
      padding: 20px;
      position: relative;
    }

    .previewAvatar {
      width: 80px;
      height: 80px;

      border-radius: 50%;
      object-fit: cover;

      background: #5865f2;

      border: 5px solid #313338;

      margin-top: -55px;
    }

    .previewName {
      font-size: 22px;
      font-weight: bold;
      margin-top: 8px;
    }

    .previewUsername {
      color: #949ba4;
    }

    .previewStatus {
      margin-top: 12px;
      color: #23a55a;
    }

    .previewBio {
      margin-top: 12px;
      color: #dbdee1;
      white-space: pre-wrap;
    }

    .previewEmoji {
      font-size: 30px;
      margin-top: 10px;
    }

    .profileActions {
      grid-column: 1 / -1;

      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .saveButton,
    .cancelButton {
      border: none;

      padding: 11px 18px;
      border-radius: 7px;

      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .saveButton {
      background: #23a55a;
    }

    .cancelButton {
      background: #4e5058;
    }

    /* =========================
       PUBLIC PROFILE POPUP
    ========================= */

    #userProfilePopup {
      display: none;

      position: fixed;
      z-index: 200;

      width: 330px;
      max-width: calc(100vw - 30px);

      background: #1e1f22;
      border-radius: 12px;

      overflow: hidden;

      box-shadow:
        0 20px 60px rgba(0,0,0,.65);

      border:
        1px solid #111214;
    }

    .popupBanner {
      height: 105px;

      background: #5865f2;

      background-size: cover;
      background-position: center;
    }

    .popupBody {
      padding: 16px;

      position: relative;
    }

    .popupAvatar {
      width: 75px;
      height: 75px;

      border-radius: 50%;
      object-fit: cover;

      background: #5865f2;

      border: 5px solid #1e1f22;

      margin-top: -55px;

      display: block;
    }

    .popupName {
      font-size: 21px;
      font-weight: bold;

      margin-top: 8px;

      word-break: break-word;
    }

    .popupUsername {
      color: #949ba4;
      font-size: 14px;
    }

    .popupStatus {
      margin-top: 10px;
      color: #b5bac1;

      font-size: 13px;
    }

    .popupBio {
      margin-top: 12px;

      color: #dbdee1;

      font-size: 14px;

      white-space: pre-wrap;
      word-break: break-word;
    }

    .popupEmoji {
      font-size: 27px;
      margin-top: 12px;
    }

    .popupDecoration {
      margin-top: 8px;
      font-size: 14px;
    }

    .popupLinks {
      display: flex;
      flex-direction: column;
      gap: 5px;

      margin-top: 12px;
    }

    .popupLinks a {
      color: #00a8fc;
      text-decoration: none;

      font-size: 13px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .popupLinks a:hover {
      text-decoration: underline;
    }

    .popupOnline {
      margin-top: 12px;

      font-size: 12px;
      color: #23a55a;
    }

    .popupClose {
      position: absolute;

      top: 10px;
      right: 10px;

      width: 30px;
      height: 30px;

      border: none;
      border-radius: 50%;

      background: rgba(0,0,0,.45);
      color: white;

      cursor: pointer;

      font-size: 17px;
    }

    .popupClose:hover {
      background: rgba(0,0,0,.7);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 750px) {

      .sidebar {
        width: 190px;
      }

      .profileEditor {
        grid-template-columns: 1fr;
      }

      .profileEditor h2,
      .profileActions {
        grid-column: auto;
      }

      #mentionContainer {
        right: 10px;
        width: calc(100vw - 20px);
      }

    }

  </style>
</head>

<body>

  <!-- AUTH -->

  <div id="authScreen">

    <div class="authBox">

      <h1 id="authTitle">
        Welcome Back
      </h1>

      <p id="authSubtitle">
        Log in to your account
      </p>

      <div id="usernameContainer" style="display:none;">

        <input
          id="usernameInput"
          type="text"
          placeholder="Username"
          maxlength="32"
        >

      </div>

      <input
        id="emailInput"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="passwordInput"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button
        class="authButton"
        id="authButton"
      >
        Log In
      </button>

      <p>

        <span id="switchText">
          Don't have an account?
        </span>

        <button
          class="switchButton"
          id="switchButton"
        >
          Sign Up
        </button>

      </p>

      <div id="authMessage"></div>

    </div>

  </div>


  <!-- CHAT -->

  <div id="chatScreen">

    <div class="app">

      <aside class="sidebar">

        <div class="serverTitle">
          💬 My Chat
        </div>

        <div class="rooms">

          <div
            class="room active"
            data-channel="general"
          >
            💬 general
          </div>

          <div
            class="room"
            data-channel="gaming"
          >
            🎮 gaming
          </div>

          <div
            class="room"
            data-channel="art"
          >
            🎨 art
          </div>

          <div
            class="room"
            data-channel="memes"
          >
            😂 memes
          </div>

        </div>

        <div class="userPanel">

          <div
            id="currentAvatar"
            class="smallAvatar"
          >
            👤
          </div>

          <div class="userInfo">

            <div
              class="userName"
              id="currentUsername"
            >
              User
            </div>

            <div class="userStatus">
              ● Online
            </div>

          </div>

          <button
            class="profileButton"
            id="openProfile"
          >
            👤
          </button>

          <button
            class="logoutButton"
            id="logoutButton"
          >
            ↪
          </button>

        </div>

      </aside>


      <main class="main">

        <div
          class="chatHeader"
          id="chatHeader"
        >
          # general
        </div>

        <div id="messages"></div>

        <div class="chatInputArea">

          <form
            class="chatForm"
            id="chatForm"
          >

            <input
              id="messageInput"
              type="text"
              placeholder="Message #general"
              autocomplete="off"
              maxlength="2000"
            >

            <button
              id="sendButton"
              type="submit"
            >
              Send
            </button>

          </form>

        </div>

      </main>

    </div>

  </div>


  <!-- ANNOUNCEMENT POPUP -->

  <div id="announcementPopup">

    <div class="announcementIcon">
      📢
    </div>

    <div class="announcementContent">

      <div class="announcementTitle">
        Announcement
      </div>

      <div id="announcementText"></div>

    </div>

    <button
      id="closeAnnouncement"
      type="button"
    >
      ×
    </button>

  </div>


  <!-- MENTION NOTIFICATIONS -->

  <div id="mentionContainer"></div>


  <!-- PROFILE EDITOR -->

  <div id="profileModal">

    <div class="profileEditor">

      <h2>
        Customize Your Profile ✨
      </h2>

      <div class="editorFields">

        <label>Display Name</label>

        <input
          id="displayNameInput"
          maxlength="32"
          placeholder="Your display name"
        >

        <label>Username</label>

        <input
          id="profileUsernameInput"
          maxlength="32"
          placeholder="username"
        >

        <label>Profile Picture URL</label>

        <input
          id="avatarInput"
          placeholder="https://example.com/image.png"
        >

        <label>Banner URL</label>

        <input
          id="bannerInput"
          placeholder="https://example.com/banner.png"
        >

        <label>Bio</label>

        <textarea
          id="bioInput"
          maxlength="190"
          placeholder="Tell people about yourself..."
        ></textarea>

        <label>Custom Status</label>

        <input
          id="customStatusInput"
          maxlength="100"
          placeholder="What are you doing?"
        >

        <label>Favorite Emoji</label>

        <input
          id="emojiInput"
          maxlength="4"
          placeholder="😀"
        >

        <label>Accent Color</label>

        <div class="colorRow">

          <input
            id="accentColor"
            type="color"
            value="#5865F2"
          >

          <span id="colorText">
            #5865F2
          </span>

        </div>

        <label>Website</label>

        <input
          id="websiteInput"
          placeholder="https://..."
        >

        <label>Social Link</label>

        <input
          id="socialInput"
          placeholder="https://..."
        >

        <label>Profile Decoration</label>

        <select id="decorationInput">

          <option value="">None</option>

          <option value="✨ Sparkles">
            ✨ Sparkles
          </option>

          <option value="⭐ Stars">
            ⭐ Stars
          </option>

          <option value="🌈 Rainbow">
            🌈 Rainbow
          </option>

          <option value="💫 Cosmic">
            💫 Cosmic
          </option>

          <option value="🔥 Fire">
            🔥 Fire
          </option>

        </select>

        <label>Profile Effect</label>

        <select id="effectInput">

          <option value="">None</option>

          <option value="glow">
            Glow
          </option>

          <option value="shadow">
            Shadow
          </option>

          <option value="glass">
            Glass
          </option>

        </select>

      </div>


      <div
        class="preview"
        id="profilePreview"
      >

        <div
          class="previewBanner"
          id="previewBanner"
        ></div>

        <div class="previewBody">

          <img
            id="previewAvatar"
            class="previewAvatar"
            src=""
            alt=""
          >

          <div
            class="previewName"
            id="previewName"
          >
            New User
          </div>

          <div
            class="previewUsername"
            id="previewUsername"
          >
            @username
          </div>

          <div
            class="previewStatus"
            id="previewStatus"
          >
            ● Online
          </div>

          <div
            class="previewBio"
            id="previewBio"
          >
            Your bio will appear here.
          </div>

          <div
            class="previewEmoji"
            id="previewEmoji"
          >
            😀
          </div>

          <div
            id="previewDecoration"
            style="margin-top:10px;"
          ></div>

        </div>

      </div>


      <div class="profileActions">

        <button
          class="cancelButton"
          id="closeProfile"
        >
          Cancel
        </button>

        <button
          class="saveButton"
          id="saveProfile"
        >
          Save Profile
        </button>

      </div>

    </div>

  </div>


  <!-- PUBLIC USER PROFILE POPUP -->

  <div id="userProfilePopup">

    <div
      class="popupBanner"
      id="popupBanner"
    ></div>

    <div class="popupBody">

      <button
        class="popupClose"
        id="popupClose"
      >
        ×
      </button>

      <img
        class="popupAvatar"
        id="popupAvatar"
        src=""
        alt=""
      >

      <div
        class="popupName"
        id="popupName"
      >
        User
      </div>

      <div
        class="popupUsername"
        id="popupUsername"
      >
        @username
      </div>

      <div
        class="popupStatus"
        id="popupStatus"
      >
        ● Online
      </div>

      <div
        class="popupBio"
        id="popupBio"
      ></div>

      <div
        class="popupEmoji"
        id="popupEmoji"
      ></div>

      <div
        class="popupDecoration"
        id="popupDecoration"
      ></div>

      <div
        class="popupLinks"
        id="popupLinks"
      ></div>

      <div class="popupOnline">
        ● Online
      </div>

    </div>

  </div>


  <script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      "https://tscporvkmgkwymrftzyn.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_f-OuNvj9jXyjcL0sZ3awvg__HZ3S_Ry";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================
       SOCKET.IO
    ========================= */

    const socket =
      io("https://chat-server-2h9q.onrender.com");


    /* =========================
       VARIABLES
    ========================= */

    let loggedInUser = null;
    let currentProfile = null;
    let authMode = "login";
    let currentChannel = "general";

    let announcementTimeout;


    /* =========================
       ELEMENTS
    ========================= */

    const authScreen =
      document.getElementById("authScreen");

    const chatScreen =
      document.getElementById("chatScreen");

    const authTitle =
      document.getElementById("authTitle");

    const authSubtitle =
      document.getElementById("authSubtitle");

    const usernameContainer =
      document.getElementById("usernameContainer");

    const usernameInput =
      document.getElementById("usernameInput");

    const emailInput =
      document.getElementById("emailInput");

    const passwordInput =
      document.getElementById("passwordInput");

    const authButton =
      document.getElementById("authButton");

    const switchButton =
      document.getElementById("switchButton");

    const switchText =
      document.getElementById("switchText");

    const authMessage =
      document.getElementById("authMessage");

    const messages =
      document.getElementById("messages");

    const messageInput =
      document.getElementById("messageInput");

    const chatForm =
      document.getElementById("chatForm");

    const currentUsername =
      document.getElementById("currentUsername");

    const chatHeader =
      document.getElementById("chatHeader");


    /* =========================
       ANNOUNCEMENT ELEMENTS
    ========================= */

    const announcementPopup =
      document.getElementById(
        "announcementPopup"
      );

    const announcementText =
      document.getElementById(
        "announcementText"
      );

    const closeAnnouncement =
      document.getElementById(
        "closeAnnouncement"
      );

    const mentionContainer =
      document.getElementById(
        "mentionContainer"
      );


    /* =========================
       AUTH SWITCH
    ========================= */

    switchButton.addEventListener(
      "click",
      () => {

        if (authMode === "login") {

          authMode = "signup";

          authTitle.textContent =
            "Create Account";

          authSubtitle.textContent =
            "Make your new account";

          usernameContainer.style.display =
            "block";

          authButton.textContent =
            "Sign Up";

          switchText.textContent =
            "Already have an account?";

          switchButton.textContent =
            "Log In";

          passwordInput.autocomplete =
            "new-password";

        }

        else {

          authMode = "login";

          authTitle.textContent =
            "Welcome Back";

          authSubtitle.textContent =
            "Log in to your account";

          usernameContainer.style.display =
            "none";

          authButton.textContent =
            "Log In";

          switchText.textContent =
            "Don't have an account?";

          switchButton.textContent =
            "Sign Up";

          passwordInput.autocomplete =
            "current-password";

        }

        authMessage.textContent = "";

      }
    );


    /* =========================
       AUTH
    ========================= */

    authButton.addEventListener(
      "click",
      async () => {

        authMessage.textContent = "";

        const email =
          emailInput.value
            .trim()
            .toLowerCase();

        const password =
          passwordInput.value;


        if (!email || !password) {

          authMessage.textContent =
            "Please enter your email and password.";

          return;

        }


        /* SIGN UP */

        if (authMode === "signup") {

          const username =
            usernameInput.value.trim();


          if (!username) {

            authMessage.textContent =
              "Please choose a username.";

            return;

          }


          if (username.length < 3) {

            authMessage.textContent =
              "Username must be at least 3 characters.";

            return;

          }


          const {
            data,
            error
          } =
            await supabaseClient.auth.signUp({

              email:
                email,

              password:
                password

            });


          if (error) {

            console.error(
              "Sign up error:",
              error
            );

            authMessage.textContent =
              error.message;

            return;

          }


          if (!data.user) {

            authMessage.textContent =
              "Account could not be created.";

            return;

          }


          const {
            error: profileError
          } =
            await supabaseClient
              .from("profiles")
              .insert({

                id:
                  data.user.id,

                username:
                  username,

                display_name:
                  username

              });


          if (profileError) {

            console.error(
              "Profile creation error:",
              profileError
            );

            authMessage.textContent =
              "Account was created, but the profile could not be created: " +
              profileError.message;

            return;

          }


          loggedInUser =
            data.user;


          await loadProfile();

          showChat();

        }


        /* LOGIN */

        else {

          const {
            data,
            error
          } =
            await supabaseClient.auth
              .signInWithPassword({

                email:
                  email,

                password:
                  password

              });


          if (error) {

            console.error(
              "Login error:",
              error
            );

            authMessage.textContent =
              "Login failed: " +
              error.message;

            return;

          }


          if (
            !data ||
            !data.user
          ) {

            authMessage.textContent =
              "Login failed. No user was returned.";

            return;

          }


          loggedInUser =
            data.user;


          await loadProfile();

          showChat();

        }

      }
    );


    /* =========================
       SESSION
    ========================= */

    async function checkSession() {

      const {
        data
      } =
        await supabaseClient.auth
          .getSession();


      if (data.session) {

        loggedInUser =
          data.session.user;

        await loadProfile();

        showChat();

      }

    }


    checkSession();


    /* =========================
       LOAD PROFILE
    ========================= */

    async function loadProfile() {

      if (!loggedInUser) return;


      let {
        data,
        error
      } =
        await supabaseClient
          .from("profiles")
          .select("*")
          .eq(
            "id",
            loggedInUser.id
          )
          .maybeSingle();


      if (error) {

        console.error(
          "Profile loading error:",
          error
        );

      }


      if (!data) {

        const fallbackUsername =
          loggedInUser.email
            ? loggedInUser.email
                .split("@")[0]
            : "User";


        const result =
          await supabaseClient
            .from("profiles")
            .insert({

              id:
                loggedInUser.id,

              username:
                fallbackUsername,

              display_name:
                fallbackUsername

            })
            .select()
            .single();


        data =
          result.data;

      }


      currentProfile =
        data;


      updateCurrentUserUI();

    }


    /* =========================
       UPDATE CURRENT USER UI
    ========================= */

    function updateCurrentUserUI() {

      if (!currentProfile) return;


      const displayName =
        currentProfile.display_name ||
        currentProfile.username ||
        "User";


      currentUsername.textContent =
        displayName;


      const oldAvatar =
        document.getElementById(
          "currentAvatar"
        );


      if (currentProfile.avatar_url) {

        const newAvatar =
          document.createElement("img");


        newAvatar.id =
          "currentAvatar";

        newAvatar.className =
          "smallAvatar";

        newAvatar.src =
          currentProfile.avatar_url;

        newAvatar.alt = "";

        newAvatar.style.cursor =
          "pointer";


        newAvatar.addEventListener(
          "click",
          () => {

            openUserProfile(
              currentProfile.id
            );

          }
        );


        oldAvatar.replaceWith(
          newAvatar
        );

      }

      else {

        oldAvatar.textContent =
          (
            displayName[0] ||
            "U"
          ).toUpperCase();

        oldAvatar.onclick =
          () => {

            openUserProfile(
              currentProfile.id
            );

          };

      }


      currentUsername.onclick =
        () => {

          openUserProfile(
            currentProfile.id
          );

        };

      currentUsername.style.cursor =
        "pointer";

    }


    /* =========================
       SHOW CHAT
    ========================= */

    function showChat() {

      authScreen.style.display =
        "none";

      chatScreen.style.display =
        "block";

      updateCurrentUserUI();


      /*
        Register this user with the
        Socket.IO server so mentions
        can find them.
      */

      if (loggedInUser) {

        socket.emit(
          "register user",
          loggedInUser.id
        );

      }


      joinChannel(
        currentChannel
      );

      messageInput.focus();

    }


    /* =========================
       CHANNEL SYSTEM
    ========================= */

    document
      .querySelectorAll(".room")
      .forEach(room => {

        room.addEventListener(
          "click",
          () => {

            const channel =
              room.dataset.channel;

            joinChannel(
              channel
            );

          }

        );

      });


    function joinChannel(channel) {

      currentChannel =
        channel;


      socket.emit(
        "join channel",
        channel
      );


      document
        .querySelectorAll(".room")
        .forEach(room => {

          room.classList.toggle(
            "active",
            room.dataset.channel ===
              channel
          );

        });


      chatHeader.textContent =
        "# " + channel;


      messageInput.placeholder =
        "Message #" + channel;


      messages.innerHTML = "";

    }


    /* =========================
       SEND MESSAGE
       ========================= */

    chatForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const text =
          messageInput.value.trim();


        if (
          !text ||
          !loggedInUser ||
          !currentProfile
        ) {

          return;

        }


        /* =========================
           /ANNOUNCEMENT COMMAND
        ========================= */

        if (
          text
            .toLowerCase()
            .startsWith(
              "/announcement "
            )
        ) {

          const announcementMessage =
            text
              .slice(
                "/announcement ".length
              )
              .trim();


          if (!announcementMessage) {

            return;

          }


          socket.emit(
            "announcement",
            {
              text:
                announcementMessage
            }
          );


          messageInput.value = "";

          return;

        }


        /* =========================
           FIND @MENTIONS
        ========================= */

        const mentionMatches =
          text.match(
            /@([a-zA-Z0-9_.-]+)/g
          ) || [];


        const mentionedUsernames =
          [
            ...new Set(
              mentionMatches.map(
                mention =>
                  mention
                    .slice(1)
                    .toLowerCase()
              )
            )
          ];


        let mentionedUserIds = [];


        /*
          Look up each username using
          case-insensitive matching.
        */

        if (
          mentionedUsernames.length > 0
        ) {

          const profileResults =
            await Promise.all(

              mentionedUsernames.map(
                async username => {

                  const {
                    data,
                    error
                  } =
                    await supabaseClient
                      .from("profiles")
                      .select(
                        "id, username"
                      )
                      .ilike(
                        "username",
                        username
                      )
                      .limit(1)
                      .maybeSingle();


                  if (
                    error ||
                    !data
                  ) {

                    return null;

                  }


                  return data;

                }
              )

            );


          mentionedUserIds =
            profileResults
              .filter(
                profile =>
                  profile !== null
              )
              .map(
                profile =>
                  profile.id
              );

        }


        /* =========================
           SEND MESSAGE
        ========================= */

        socket.emit(
          "chat message",
          {

            text:
              text,

            userId:
              loggedInUser.id,

            username:
              currentProfile.username ||
              "user",

            displayName:
              currentProfile.display_name ||
              currentProfile.username ||
              "User",

            avatar:
              currentProfile.avatar_url ||
              "",

            timestamp:
              new Date().toISOString(),

            channel:
              currentChannel,

            mentionedUserIds:
              mentionedUserIds

          }
        );


        messageInput.value = "";

      }
    );


    /* =========================
       RECEIVE MESSAGE
    ========================= */

    socket.on(
      "chat message",
      message => {

        if (
          message.channel &&
          message.channel !==
            currentChannel
        ) {

          return;

        }


        addMessage(
          message
        );

      }
    );


    /* =========================
       MENTION NOTIFICATION
    ========================= */

    socket.on(
      "mention notification",
      notification => {

        showMentionNotification(
          notification
        );

      }
    );


    function showMentionNotification(
      notification
    ) {

      const notificationElement =
        document.createElement(
          "div"
        );


      notificationElement.className =
        "mentionNotification";


      const from =
        notification.fromDisplayName ||
        notification.fromUsername ||
        "Someone";


      const channel =
        notification.channel ||
        "general";


      notificationElement.innerHTML = `

        <div class="mentionTitle">
          🔔 ${escapeHtml(from)}
          mentioned you!
        </div>

        <div class="mentionText">
          ${escapeHtml(
            notification.message || ""
          )}
        </div>

        <div class="mentionChannel">
          #${escapeHtml(channel)}
        </div>

      `;


      notificationElement.addEventListener(
        "click",
        () => {

          joinChannel(
            channel
          );

          notificationElement.remove();

        }
      );


      mentionContainer.appendChild(
        notificationElement
      );


      setTimeout(
        () => {

          notificationElement.remove();

        },
        7000
      );

    }


    /* =========================
       ANNOUNCEMENT NOTIFICATION
    ========================= */

    socket.on(
      "announcement",
      announcement => {

        if (
          !announcement ||
          !announcement.text
        ) {

          return;

        }


        announcementText.textContent =
          announcement.text;


        announcementPopup.classList.add(
          "show"
        );


        clearTimeout(
          announcementTimeout
        );


        announcementTimeout =
          setTimeout(
            () => {

              announcementPopup.classList.remove(
                "show"
              );

            },
            8000
          );

      }
    );


    /* CLOSE ANNOUNCEMENT */

    closeAnnouncement.addEventListener(
      "click",
      () => {

        announcementPopup.classList.remove(
          "show"
        );


        clearTimeout(
          announcementTimeout
        );

      }
    );


    /* =========================
       ADD MESSAGE
    ========================= */

    function addMessage(message) {

      const messageElement =
        document.createElement(
          "div"
        );


      messageElement.className =
        "message";


      const userId =
        message.userId || "";


      /* AVATAR */

      let avatarHTML = "";


      if (message.avatar) {

        avatarHTML = `

          <img
            class="messageAvatar profileClickable"
            data-user-id="${escapeHtml(
              userId
            )}"
            src="${escapeHtml(
              message.avatar
            )}"
            alt=""
          >

        `;

      }

      else {

        const firstLetter =
          (
            message.displayName ||
            message.username ||
            "U"
          )[0].toUpperCase();


        avatarHTML = `

          <div
            class="messageAvatar profileClickable"
            data-user-id="${escapeHtml(
              userId
            )}"
            style="
              display:flex;
              align-items:center;
              justify-content:center;
              font-weight:bold;
              background:#5865F2;
            "
          >
            ${escapeHtml(
              firstLetter
            )}
          </div>

        `;

      }


      const name =
        message.displayName ||
        message.username ||
        "User";


      let time = "";


      if (message.timestamp) {

        const date =
          new Date(
            message.timestamp
          );


        time =
          date.toLocaleTimeString(
            [],
            {
              hour: "numeric",
              minute: "2-digit"
            }
          );

      }


      messageElement.innerHTML = `

        ${avatarHTML}

        <div
          class="messageContent"
        >

          <div
            class="messageTop"
          >

            <span
              class="messageUsername profileClickable"
              data-user-id="${escapeHtml(
                userId
              )}"
              title="@${escapeHtml(
                message.username ||
                "user"
              )}"
            >
              ${escapeHtml(
                name
              )}
            </span>

            <span
              class="timestamp"
            >
              ${escapeHtml(
                time
              )}
            </span>

          </div>

          <div
            class="messageText"
          >
            ${escapeHtml(
              message.text ||
              ""
            )}
          </div>

        </div>

      `;


      /* MAKE PFP + NAME CLICKABLE */

      messageElement
        .querySelectorAll(
          ".profileClickable"
        )
        .forEach(element => {

          element.addEventListener(
            "click",
            event => {

              event.stopPropagation();

              const clickedUserId =
                element.dataset.userId;


              if (
                clickedUserId
              ) {

                openUserProfile(
                  clickedUserId
                );

              }

            }
          );

        });


      messages.appendChild(
        messageElement
      );


      messages.scrollTop =
        messages.scrollHeight;

    }


    /* =========================
       PUBLIC USER PROFILE
    ========================= */

    const userProfilePopup =
      document.getElementById(
        "userProfilePopup"
      );

    const popupBanner =
      document.getElementById(
        "popupBanner"
      );

    const popupAvatar =
      document.getElementById(
        "popupAvatar"
      );

    const popupName =
      document.getElementById(
        "popupName"
      );

    const popupUsername =
      document.getElementById(
        "popupUsername"
      );

    const popupStatus =
      document.getElementById(
        "popupStatus"
      );

    const popupBio =
      document.getElementById(
        "popupBio"
      );

    const popupEmoji =
      document.getElementById(
        "popupEmoji"
      );

    const popupDecoration =
      document.getElementById(
        "popupDecoration"
      );

    const popupLinks =
      document.getElementById(
        "popupLinks"
      );


    async function openUserProfile(userId) {

      if (!userId) {
        return;
      }


      userProfilePopup.style.display =
        "block";


      popupName.textContent =
        "Loading...";

      popupUsername.textContent =
        "";

      popupBio.textContent =
        "";

      popupStatus.textContent =
        "";

      popupEmoji.textContent =
        "";

      popupDecoration.textContent =
        "";

      popupLinks.innerHTML =
        "";


      /* POSITION NEAR CENTER */

      userProfilePopup.style.left =
        "50%";

      userProfilePopup.style.top =
        "50%";

      userProfilePopup.style.transform =
        "translate(-50%, -50%)";


      const {
        data,
        error
      } =
        await supabaseClient
          .from("profiles")
          .select("*")
          .eq(
            "id",
            userId
          )
          .maybeSingle();


      if (error) {

        console.error(
          "Could not load user profile:",
          error
        );

        popupName.textContent =
          "Could not load profile.";

        return;

      }


      if (!data) {

        popupName.textContent =
          "User not found.";

        return;

      }


      displayPublicProfile(
        data
      );

    }


    function displayPublicProfile(profile) {

      const name =
        profile.display_name ||
        profile.username ||
        "User";


      const username =
        profile.username ||
        "user";


      const color =
        profile.accent_color ||
        "#5865F2";


      /* NAME */

      popupName.textContent =
        name;


      popupName.style.color =
        color;


      /* USERNAME */

      popupUsername.textContent =
        "@" + username;


      /* BANNER */

      popupBanner.style.backgroundColor =
        color;


      if (profile.banner_url) {

        popupBanner.style.backgroundImage =
          `url("${profile.banner_url}")`;

      }

      else {

        popupBanner.style.backgroundImage =
          "none";

      }


      /* AVATAR */

      if (profile.avatar_url) {

        popupAvatar.src =
          profile.avatar_url;

      }

      else {

        popupAvatar.src =
          "https://via.placeholder.com/100/5865F2/FFFFFF?text=" +
          encodeURIComponent(
            (
              name[0] ||
              "U"
            ).toUpperCase()
          );

      }


      /* STATUS */

      if (profile.custom_status) {

        popupStatus.textContent =
          "● " +
          profile.custom_status;

      }

      else {

        popupStatus.textContent =
          "● Online";

      }


      /* BIO */

      if (profile.bio) {

        popupBio.textContent =
          profile.bio;

      }

      else {

        popupBio.textContent =
          "No bio yet.";

      }


      /* EMOJI */

      popupEmoji.textContent =
        profile.favorite_emoji ||
        "😀";


      /* DECORATION */

      if (
        profile.profile_decoration
      ) {

        popupDecoration.textContent =
          profile.profile_decoration;

      }

      else {

        popupDecoration.textContent =
          "";

      }


      /* EFFECT */

      userProfilePopup.style.boxShadow =
        "0 20px 60px rgba(0,0,0,.65)";


      if (
        profile.profile_effect ===
        "glow"
      ) {

        userProfilePopup.style.boxShadow =
          `0 0 30px ${color}`;

      }

      else if (
        profile.profile_effect ===
        "shadow"
      ) {

        userProfilePopup.style.boxShadow =
          "0 25px 70px rgba(0,0,0,.9)";

      }

      else if (
        profile.profile_effect ===
        "glass"
      ) {

        userProfilePopup.style.backdropFilter =
          "blur(15px)";

        userProfilePopup.style.background =
          "rgba(30,31,34,.85)";

      }

      else {

        userProfilePopup.style.backdropFilter =
          "none";

        userProfilePopup.style.background =
          "#1e1f22";

      }


      /* LINKS */

      popupLinks.innerHTML =
        "";


      if (profile.website_url) {

        addPopupLink(
          "🌐 Website",
          profile.website_url
        );

      }


      if (profile.social_url) {

        addPopupLink(
          "🔗 Social",
          profile.social_url
        );

      }

    }


    function addPopupLink(
      label,
      url
    ) {

      let safeUrl =
        url.trim();


      if (
        !safeUrl.startsWith("http://") &&
        !safeUrl.startsWith("https://")
      ) {

        safeUrl =
          "https://" +
          safeUrl;

      }


      const link =
        document.createElement(
          "a"
        );


      link.href =
        safeUrl;

      link.target =
        "_blank";

      link.rel =
        "noopener noreferrer";

      link.textContent =
        label + ": " + safeUrl;


      popupLinks.appendChild(
        link
      );

    }


    /* =========================
       CLOSE PUBLIC PROFILE
    ========================= */

    document
      .getElementById(
        "popupClose"
      )
      .addEventListener(
        "click",
        () => {

          userProfilePopup.style.display =
            "none";

        }
      );


    /* CLICK OUTSIDE POPUP */

    document.addEventListener(
      "click",
      event => {

        if (
          userProfilePopup.style.display !==
          "block"
        ) {

          return;

        }


        if (
          !userProfilePopup.contains(
            event.target
          ) &&
          !event.target.closest(
            ".profileClickable"
          )
        ) {

          userProfilePopup.style.display =
            "none";

        }

      }
    );


    /* ESCAPE KEY */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Escape"
        ) {

          userProfilePopup.style.display =
            "none";

        }

      }
    );


    /* =========================
       LOGOUT
    ========================= */

    document
      .getElementById(
        "logoutButton"
      )
      .addEventListener(
        "click",
        async () => {

          await supabaseClient.auth
            .signOut();


          loggedInUser = null;
          currentProfile = null;


          chatScreen.style.display =
            "none";

          authScreen.style.display =
            "flex";


          emailInput.value = "";
          passwordInput.value = "";
          usernameInput.value = "";

          messages.innerHTML = "";

        }
      );


    /* =========================
       PROFILE EDITOR
    ========================= */

    const profileModal =

      )
      .addEventListener(

    const displayNameInput =

       OPEN PROFILE EDITOR

    function openProfileEditor() {

      if (!currentProfile) {
        return;
      }


      displayNameInput.value =
        currentProfile.display_name ||
        "";

      profileUsernameInput.value =
        currentProfile.username ||

        "";

        "";

      customStatusInput.value =

      emojiInput.value =

        "";

       PREVIEW
    ========================= */

    const previewName =
      document.getElementById(

    const previewAvatar =

        "previewAvatar"
      );

    const previewBanner =
      document.getElementById(
        "previewBanner"
      );

    const previewBio =
      document.getElementById(
        "previewBio"
      );

    const previewStatus =
      document.getElementById(
        "previewStatus"
      );

      document.getElementById(

      );

    const previewDecoration =
      document.getElementById(
        "previewDecoration"
      );

    const colorText =
      document.getElementById(
        "colorText"
      );


    function updatePreview() {

      const name =
        displayNameInput.value ||
        "New User";

      const username =
        profileUsernameInput.value ||
        "username";

      const avatar =
        avatarInput.value;

      const banner =
        bannerInput.value;

      const bio =
        bioInput.value ||
        "Your bio will appear here.";

      const status =
        customStatusInput.value ||
        "Online";

      const emoji =
        emojiInput.value ||
        "😀";

      const color =
        accentColor.value ||
        "#5865F2";


      previewName.textContent =
        name;

      previewUsername.textContent =
        "@" + username;

      previewBio.textContent =
        bio;

      previewStatus.textContent =
        "● " + status;

      previewEmoji.textContent =
        emoji;

      colorText.textContent =
        color;


      previewBanner.style.backgroundColor =
        color;


      if (banner) {

        previewBanner.style.backgroundImage =
          `url("${banner}")`;

      }

      else {

        previewBanner.style.backgroundImage =
          "none";

      }


      if (avatar) {

        previewAvatar.src =
          avatar;

      }

      else {

        previewAvatar.src =
          "https://via.placeholder.com/100";

      }


      previewDecoration.textContent =
        decorationInput.value;


      const preview =
        document.getElementById(
          "profilePreview"
        );


      preview.style.boxShadow =
        "none";

      preview.style.backdropFilter =
        "none";


      if (
        effectInput.value ===
        "glow"
      ) {

        preview.style.boxShadow =
          `0 0 25px ${color}`;

      }


      if (
        effectInput.value ===
        "shadow"
      ) {

        preview.style.boxShadow =
          "0 20px 50px rgba(0,0,0,.7)";

      }


      if (
        effectInput.value ===
        "glass"
      ) {

        preview.style.backdropFilter =
          "blur(15px)";

      }

    }


    [
      displayNameInput,
      profileUsernameInput,
      avatarInput,
      bannerInput,
      bioInput,
      customStatusInput,
      emojiInput,
      accentColor,
      websiteInput,
      socialInput,
      decorationInput,
      effectInput
    ].forEach(
      element => {

        element.addEventListener(
          "input",
          updatePreview
        );

        element.addEventListener(
          "change",
          updatePreview
        );

      }
    );


    /* =========================
       SAVE PROFILE
    ========================= */

    document
      .getElementById(
        "saveProfile"
      )
      .addEventListener(
        "click",
        async () => {

          if (!loggedInUser) {
            return;
          }


          const username =
            profileUsernameInput.value
              .trim();


          const displayName =
            displayNameInput.value
              .trim();


          if (!username) {

            alert(
              "Please enter a username."
            );

            return;

          }


          if (!displayName) {

            alert(
              "Please enter a display name."
            );

            return;

          }


          const updateData = {

            username:
              username,

            display_name:
              displayName,

            bio:
              bioInput.value.trim(),

            avatar_url:
              avatarInput.value.trim(),

            banner_url:
              bannerInput.value.trim(),

            accent_color:
              accentColor.value,

            custom_status:
              customStatusInput.value.trim(),

            favorite_emoji:
              emojiInput.value.trim() ||
              "😀",

            website_url:
              websiteInput.value.trim(),

            social_url:
              socialInput.value.trim(),

            profile_decoration:
              decorationInput.value,

            profile_effect:
              effectInput.value,

            updated_at:
              new Date().toISOString()

          };


          const {
            data,
            error
          } =
            await supabaseClient
              .from("profiles")
              .update(
                updateData
              )
              .eq(
                "id",
                loggedInUser.id
              )
              .select()
              .single();


          if (error) {

            alert(
              "Could not save profile:\n" +
              error.message
            );

            console.error(
              error
            );

            return;

          }


          currentProfile =
            data;


          updateCurrentUserUI();


          profileModal.style.display =
            "none";


          alert(
            "Profile saved! 🎉"
          );

        }
      );


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHtml(value) {

      const div =
        document.createElement(
          "div"
        );


      div.textContent =
        String(
          value ?? ""
        );


      return div.innerHTML;

    }

  </script>
