  <script>

    /* =========================

    ========================= */

    const SUPABASE_URL =
      "https://tscporvkmgkwymrftzyn.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_f-OuNvj9jXyjcL0sZ3awvg__HZ3S_Ry";

    const supabaseClient =
      window.supabase.createClient(

      );


    /* =========================
       SOCKET.IO
    ========================= */

    const socket =
      io("https://chat-server-2h9q.onrender.com");


    /* =========================
       VARIABLES
    ========================= */

    let loggedInUser = null;
    let currentProfile = null;
    let authMode = "login";
    let currentChannel = "general";


    /* =========================
       ELEMENTS
    ========================= */

    const authScreen =
      document.getElementById(
        "authScreen"
      );

    const chatScreen =

        "authButton"
      );

    const switchButton =
      document.getElementById(
        "switchButton"
      );

    const switchText =
      document.getElementById(
        "switchText"
      );

    const authMessage =
      document.getElementById(
        "authMessage"
      );

        "messages"
      );

    const messageInput =

        "messageInput"
      );

    const chatForm =

        "chatForm"
      );

    const currentUsername =
      document.getElementById(
        "currentUsername"
      );

    const chatHeader =
      document.getElementById(
        "chatHeader"
      );


    /* =========================
       AUTH SWITCH
    ========================= */

    switchButton.addEventListener(
      "click",
      () => {

        if (authMode === "login") {

          authMode = "signup";

          authTitle.textContent =
            "Create Account";

          authSubtitle.textContent =
            "Make your new account";

          usernameContainer.style.display =
            "block";

          authButton.textContent =
            "Sign Up";

          switchText.textContent =
            "Already have an account?";

          switchButton.textContent =
            "Log In";

          passwordInput.autocomplete =
            "new-password";

        }

        else {

          authMode = "login";

          authTitle.textContent =
            "Welcome Back";

          authSubtitle.textContent =
            "Log in to your account";

          usernameContainer.style.display =
            "none";

          authButton.textContent =
            "Log In";

          switchText.textContent =
            "Don't have an account?";

          switchButton.textContent =
            "Sign Up";

          passwordInput.autocomplete =
            "current-password";

        }

        authMessage.textContent = "";

      }
    );


    /* =========================
       AUTH
    ========================= */

    authButton.addEventListener(
      "click",
      async () => {

        authMessage.textContent = "";

        const email =
          emailInput.value
            .trim()
            .toLowerCase();

        const password =
          passwordInput.value;


        if (!email || !password) {

          authMessage.textContent =
            "Please enter your email and password.";

          return;

        }


        /* =========================
           SIGN UP
        ========================= */

        if (authMode === "signup") {

          const username =
            usernameInput.value.trim();


          if (!username) {

            authMessage.textContent =
              "Please choose a username.";

            return;

          }


          if (username.length < 3) {

            authMessage.textContent =
              "Username must be at least 3 characters.";

            return;

          }


          const {
            data,
            error
          } =
            await supabaseClient.auth.signUp({

              email:
                email,

              password:
                password

            });


          if (error) {

            console.error(
              "Sign up error:",
              error
            );

            authMessage.textContent =
              error.message;

            return;

          }


          if (!data.user) {

            authMessage.textContent =
              "Account could not be created.";

            return;

          }


          const {
            error: profileError
          } =
            await supabaseClient
              .from("profiles")
              .insert({

                id:
                  data.user.id,

                username:
                  username,

                display_name:
                  username

              });


          if (profileError) {

            console.error(
              "Profile creation error:",
              profileError
            );

            authMessage.textContent =
              "Account was created, but the profile could not be created: " +
              profileError.message;

            return;

          }


          loggedInUser =
            data.user;


          await loadProfile();

          showChat();

        }


        /* =========================
           LOGIN
        ========================= */

        else {

          const {
            data,
            error
          } =
            await supabaseClient.auth
              .signInWithPassword({

                email:
                  email,

                password:
                  password

              });


          if (error) {

            console.error(
              "Login error:",
              error
            );

            authMessage.textContent =
              "Login failed: " +
              error.message;

            return;

          }


          if (
            !data ||
            !data.user
          ) {

            authMessage.textContent =
              "Login failed. No user was returned.";

            return;

          }


          loggedInUser =
            data.user;


          await loadProfile();

          showChat();

        }

      }
    );


    /* =========================
       SESSION
    ========================= */

    async function checkSession() {

      const {
        data
      } =
        await supabaseClient.auth
          .getSession();


      if (data.session) {

        loggedInUser =
          data.session.user;

        await loadProfile();

        showChat();

      }

    }


    checkSession();


    /* =========================
       LOAD PROFILE
    ========================= */

    async function loadProfile() {

      if (!loggedInUser) return;


      let {
        data,
        error
      } =
        await supabaseClient
          .from("profiles")
          .select("*")
          .eq(
            "id",
            loggedInUser.id
          )
          .maybeSingle();


      if (error) {

        console.error(
          "Profile loading error:",
          error
        );

      }


      if (!data) {

        const fallbackUsername =
          loggedInUser.email
            ? loggedInUser.email
                .split("@")[0]
            : "User";


        const result =
          await supabaseClient
            .from("profiles")
            .insert({

              id:
                loggedInUser.id,

              username:
                fallbackUsername,

              display_name:
                fallbackUsername

            })
            .select()
            .single();


        data =
          result.data;

      }


      currentProfile =
        data;


      updateCurrentUserUI();

    }


    /* =========================
       UPDATE USER UI
    ========================= */

    function updateCurrentUserUI() {

      if (!currentProfile) return;


      const displayName =
        currentProfile.display_name ||
        currentProfile.username ||
        "User";


      currentUsername.textContent =
        displayName;


      if (currentProfile.avatar_url) {

        const oldAvatar =
          document.getElementById(
            "currentAvatar"
          );


        const newAvatar =
          document.createElement(
            "img"
          );


        newAvatar.id =
          "currentAvatar";

        newAvatar.className =
          "smallAvatar";

        newAvatar.src =
          currentProfile.avatar_url;

        newAvatar.alt = "";


        oldAvatar.replaceWith(
          newAvatar
        );

      }

      else {

        const avatar =
          document.getElementById(
            "currentAvatar"
          );


        avatar.textContent =
          (
            displayName[0] ||
            "U"
          ).toUpperCase();

      }

    }


    /* =========================
       SHOW CHAT
    ========================= */

    function showChat() {

      authScreen.style.display =
        "none";

      chatScreen.style.display =
        "block";


      updateCurrentUserUI();


      joinChannel(
        currentChannel
      );


      messageInput.focus();

    }


    /* =========================
       CHANNEL SYSTEM
    ========================= */

    document
      .querySelectorAll(".room")
      .forEach(room => {

        room.addEventListener(
          "click",
          () => {

            const channel =
              room.dataset.channel;

            joinChannel(
              channel
            );

          }

        );

      });


    function joinChannel(channel) {

      currentChannel =
        channel;


      socket.emit(
        "join channel",
        channel
      );


      document
        .querySelectorAll(".room")
        .forEach(room => {

          room.classList.toggle(
            "active",
            room.dataset.channel ===
              channel
          );

        });


      chatHeader.textContent =
        "# " + channel;


      messageInput.placeholder =
        "Message #" + channel;


      messages.innerHTML = "";

    }


    /* =========================
       SEND MESSAGE
    ========================= */

    chatForm.addEventListener(
      "submit",
      event => {

        event.preventDefault();


        const text =
          messageInput.value.trim();


        if (
          !text ||
          !loggedInUser ||
          !currentProfile
        ) {

          return;

        }


        socket.emit(
          "chat message",
          {

            text:
              text,

            userId:
              loggedInUser.id,

            username:
              currentProfile.username ||
              "user",

            displayName:
              currentProfile.display_name ||
              currentProfile.username ||
              "User",

            avatar:
              currentProfile.avatar_url ||
              "",

            timestamp:
              new Date().toISOString(),

            channel:
              currentChannel

          }
        );


        messageInput.value = "";

      }
    );


    /* =========================
       RECEIVE MESSAGE
    ========================= */

    socket.on(
      "chat message",
      message => {

        if (
          message.channel &&
          message.channel !==
            currentChannel
        ) {

          return;

        }


        addMessage(
          message
        );

      }
    );


    /* =========================
       ADD MESSAGE
    ========================= */

    function addMessage(message) {

      const messageElement =
        document.createElement(
          "div"
        );


      messageElement.className =
        "message";


      let avatarHTML = "";


      if (message.avatar) {

        avatarHTML = `

          <img
            class="messageAvatar"
            src="${escapeHtml(
              message.avatar
            )}"
            alt=""
          >

        `;

      }

      else {

        const firstLetter =
          (
            message.displayName ||
            message.username ||
            "U"
          )[0].toUpperCase();


        avatarHTML = `

          <div
            class="messageAvatar"
            style="
              display:flex;
              align-items:center;
              justify-content:center;
              font-weight:bold;
              background:#5865F2;
            "
          >
            ${escapeHtml(
              firstLetter
            )}
          </div>

        `;

      }


      const name =
        message.displayName ||
        message.username ||
        "User";


      let time = "";


      if (message.timestamp) {

        const date =
          new Date(
            message.timestamp
          );


        time =
          date.toLocaleTimeString(
            [],
            {
              hour: "numeric",
              minute: "2-digit"
            }
          );

      }


      messageElement.innerHTML = `

        ${avatarHTML}

        <div
          class="messageContent"
        >

          <div
            class="messageTop"
          >

            <span
              class="messageUsername"
              title="@${escapeHtml(
                message.username ||
                "user"
              )}"
            >
              ${escapeHtml(
                name
              )}
            </span>

            <span
              class="timestamp"
            >
              ${escapeHtml(
                time
              )}
            </span>

          </div>

          <div
            class="messageText"
          >
            ${escapeHtml(
              message.text ||
              ""
            )}
          </div>

        </div>

      `;


      messages.appendChild(
        messageElement
      );


      messages.scrollTop =
        messages.scrollHeight;

    }


    /* =========================
       LOGOUT
    ========================= */

    document
      .getElementById(
        "logoutButton"
      )
      .addEventListener(
        "click",
        async () => {

          await supabaseClient.auth
            .signOut();


          loggedInUser = null;
          currentProfile = null;


          chatScreen.style.display =
            "none";

          authScreen.style.display =
            "flex";


          emailInput.value = "";
          passwordInput.value = "";
          usernameInput.value = "";

          messages.innerHTML = "";

        }
      );


    /* =========================
       PROFILE MODAL
    ========================= */

    const profileModal =
      document.getElementById(
        "profileModal"
      );


    document
      .getElementById(
        "openProfile"
      )
      .addEventListener(
        "click",
        () => {

          openProfileEditor();

        }
      );


    document
      .getElementById(
        "closeProfile"
      )
      .addEventListener(
        "click",
        () => {

          profileModal.style.display =
            "none";

        }
      );


    /* =========================
       PROFILE INPUTS
    ========================= */

    const displayNameInput =
      document.getElementById(
        "displayNameInput"
      );

    const profileUsernameInput =
      document.getElementById(
        "profileUsernameInput"
      );

    const avatarInput =
      document.getElementById(
        "avatarInput"
      );

    const bannerInput =
      document.getElementById(
        "bannerInput"
      );

    const bioInput =
      document.getElementById(
        "bioInput"
      );

    const customStatusInput =
      document.getElementById(
        "customStatusInput"
      );

    const emojiInput =
      document.getElementById(
        "emojiInput"
      );

    const accentColor =
      document.getElementById(
        "accentColor"
      );

    const websiteInput =
      document.getElementById(
        "websiteInput"
      );

    const socialInput =
      document.getElementById(
        "socialInput"
      );

    const decorationInput =
      document.getElementById(
        "decorationInput"
      );

    const effectInput =
      document.getElementById(
        "effectInput"
      );


    /* =========================
       OPEN PROFILE
    ========================= */

    function openProfileEditor() {

      if (!currentProfile) {
        return;
      }


      displayNameInput.value =
        currentProfile.display_name ||
        "";

      profileUsernameInput.value =
        currentProfile.username ||
        "";

      avatarInput.value =
        currentProfile.avatar_url ||
        "";

      bannerInput.value =
        currentProfile.banner_url ||
        "";

      bioInput.value =
        currentProfile.bio ||
        "";

      customStatusInput.value =
        currentProfile.custom_status ||
        "";

      emojiInput.value =
        currentProfile.favorite_emoji ||
        "😀";

      accentColor.value =
        currentProfile.accent_color ||
        "#5865F2";

      websiteInput.value =
        currentProfile.website_url ||
        "";

      socialInput.value =
        currentProfile.social_url ||
        "";

      decorationInput.value =
        currentProfile.profile_decoration ||
        "";

      effectInput.value =
        currentProfile.profile_effect ||
        "";


      updatePreview();


      profileModal.style.display =
        "flex";

    }


    /* =========================
       PREVIEW
    ========================= */

    const previewName =
      document.getElementById(
        "previewName"
      );

    const previewUsername =
      document.getElementById(
        "previewUsername"
      );

    const previewAvatar =
      document.getElementById(
        "previewAvatar"
      );

    const previewBanner =
      document.getElementById(
        "previewBanner"
      );

    const previewBio =
      document.getElementById(
        "previewBio"
      );

    const previewStatus =
      document.getElementById(
        "previewStatus"
      );

    const previewEmoji =
      document.getElementById(
        "previewEmoji"
      );

    const previewDecoration =
      document.getElementById(
        "previewDecoration"
      );

    const colorText =
      document.getElementById(
        "colorText"
      );


    function updatePreview() {

      const name =
        displayNameInput.value ||
        "New User";

      const username =
        profileUsernameInput.value ||
        "username";

      const avatar =
        avatarInput.value;

      const banner =
        bannerInput.value;

      const bio =
        bioInput.value ||
        "Your bio will appear here.";

      const status =
        customStatusInput.value ||
        "Online";

      const emoji =
        emojiInput.value ||
        "😀";

      const color =
        accentColor.value ||
        "#5865F2";


      previewName.textContent =
        name;

      previewUsername.textContent =
        "@" + username;

      previewBio.textContent =
        bio;

      previewStatus.textContent =
        "● " + status;

      previewEmoji.textContent =
        emoji;

      colorText.textContent =
        color;


      previewBanner.style.backgroundColor =
        color;


      if (banner) {

        previewBanner.style.backgroundImage =
          `url("${banner}")`;

      }

      else {

        previewBanner.style.backgroundImage =
          "none";

      }


      if (avatar) {

        previewAvatar.src =
          avatar;

      }

      else {

        previewAvatar.src =
          "https://via.placeholder.com/100";

      }


      previewDecoration.textContent =
        decorationInput.value;


      const preview =
        document.getElementById(
          "profilePreview"
        );


      preview.style.boxShadow =
        "none";

      preview.style.backdropFilter =
        "none";


      if (
        effectInput.value ===
        "glow"
      ) {

        preview.style.boxShadow =
          `0 0 25px ${color}`;

      }


      if (
        effectInput.value ===
        "shadow"
      ) {

        preview.style.boxShadow =
          "0 20px 50px rgba(0,0,0,.7)";

      }


      if (
        effectInput.value ===
        "glass"
      ) {

        preview.style.backdropFilter =
          "blur(15px)";

      }

    }


    [
      displayNameInput,
      profileUsernameInput,
      avatarInput,
      bannerInput,
      bioInput,
      customStatusInput,
      emojiInput,
      accentColor,
      websiteInput,
      socialInput,
      decorationInput,
      effectInput
    ].forEach(
      element => {

        element.addEventListener(
          "input",
          updatePreview
        );

        element.addEventListener(
          "change",
          updatePreview
        );

      }
    );


    /* =========================
       SAVE PROFILE
    ========================= */

    document
      .getElementById(
        "saveProfile"
      )
      .addEventListener(
        "click",
        async () => {

          if (!loggedInUser) {
            return;
          }


          const username =
            profileUsernameInput.value
              .trim();


          const displayName =
            displayNameInput.value
              .trim();


          if (!username) {

            alert(
              "Please enter a username."
            );

            return;

          }


          if (!displayName) {

            alert(
              "Please enter a display name."
            );

            return;

          }


          const updateData = {

            username:
              username,

            display_name:
              displayName,

            bio:
              bioInput.value.trim(),

            avatar_url:
              avatarInput.value.trim(),

            banner_url:
              bannerInput.value.trim(),

            accent_color:
              accentColor.value,

            custom_status:
              customStatusInput.value.trim(),

            favorite_emoji:
              emojiInput.value.trim() ||
              "😀",

            website_url:
              websiteInput.value.trim(),

            social_url:
              socialInput.value.trim(),

            profile_decoration:
              decorationInput.value,

            profile_effect:
              effectInput.value,

            updated_at:
              new Date().toISOString()

          };


          const {
            data,
            error
          } =
            await supabaseClient
              .from("profiles")
              .update(
                updateData
              )
              .eq(
                "id",
                loggedInUser.id
              )
              .select()
              .single();


          if (error) {

            alert(
              "Could not save profile:\n" +
              error.message
            );

            console.error(
              error
            );

            return;

          }


          currentProfile =
            data;


          updateCurrentUserUI();


          profileModal.style.display =
            "none";


          alert(
            "Profile saved! 🎉"
          );

        }
      );


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHtml(value) {

      const div =
        document.createElement(
          "div"
        );


      div.textContent =
        String(
          value ?? ""
        );


      return div.innerHTML;

    }

  </script>

</body>
</html>
